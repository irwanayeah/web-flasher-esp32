<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Router Flasher</title>
  <style>
    body { font-family: Arial; text-align:center; }
    .card {
      border:1px solid #ccc;
      margin:10px;
      padding:10px;
      display:inline-block;
      width:250px;
    }
    button { padding:8px; margin-top:5px; }
  </style>
</head>

<body>

<h2>⚡ ESP32 Router OS Installer</h2>

<button onclick="connect()">🔌 Connect ESP32</button>

<h3>Firmware List</h3>
<div id="list">Loading...</div>

<p id="status">Idle</p>

<script type="module">

import { ESPLoader } from "https://unpkg.com/esptool-js@latest/bundle.js";

let loader;

const status = (t) => document.getElementById("status").innerText = t;

// CONNECT
window.connect = async () => {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    loader = new ESPLoader({ transport: port });

    status("ESP32 Connected ✔");
};

// LOAD LIST
async function loadFirmware() {
    const res = await fetch("manifest.json");
    const data = await res.json();

    const container = document.getElementById("list");
    container.innerHTML = "";

    data.firmwares.forEach(fw => {

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <h4>${fw.name}</h4>
            <p>${fw.desc}</p>
            <button onclick="flash('${fw.file}', ${fw.address})">
              Flash
            </button>
        `;

        container.appendChild(div);
    });
}

// FLASH FUNCTION
window.flash = async (file, address) => {
    try {
        status("Loading firmware...");

        const res = await fetch(file);
        const bin = await res.arrayBuffer();

        status("Flashing... jangan cabut ESP32");

        await loader.writeFlash({
            fileArray: [
                { data: bin, address: address }
            ],
            eraseAll: true,
            flashSize: "keep"
        });

        status("Flash selesai ✔");

    } catch (e) {
        console.log(e);
        status("Flash gagal ❌");
    }
};

loadFirmware();

</script>

</body>
</html>
